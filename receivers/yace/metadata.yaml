display_name: YACE Receiver
type: yace_exporter
github_project: prometheus/prometheus-opentelemetry-collector

description: |
  Receives AWS CloudWatch metrics by running the Prometheus
  [yet-another-cloudwatch-exporter](https://github.com/prometheus-community/yet-another-cloudwatch-exporter)
  as an OpenTelemetry Collector receiver.

status:
  disable_codecov_badge: true
  class: receiver
  stability:
    development: [metrics]
  distributions: [prometheus]
  codeowners:
    active: [ArthurSens]

tests:
  skip_lifecycle: true
  skip_shutdown: true
